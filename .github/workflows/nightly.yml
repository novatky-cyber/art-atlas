name: Nightly

# 毎晩 3:00（日本時間）に実行：①「解説待ち」の記録を解説 → ②作品を自動追加 → ③取得・検証 → ④コミット・公開
# 必要な Secrets: ANTHROPIC_API_KEY, SUPABASE_SERVICE_ROLE_KEY（未設定の処理はスキップして記録に残す）
on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      count:
        description: '追加する作品数'
        required: false
        default: '50'

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run nightly pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SI_API_KEY: ${{ secrets.SI_API_KEY }}
          ART_ATLAS_MODEL: ${{ vars.ART_ATLAS_MODEL }}
          NIGHTLY_COUNT: ${{ inputs.count || vars.NIGHTLY_COUNT || '50' }}
        run: node pipeline/nightly/run.mjs
      - name: Summary
        if: always()
        run: |
          echo '## 夜間処理' >> "$GITHUB_STEP_SUMMARY"
          if [ -f nightly-summary.json ]; then
            node -e "const s=require('./nightly-summary.json');console.log(s.status+'：'+s.text)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Commit data
        if: always()
        run: |
          # データ検証に失敗した場合は data/ の変更を戻し、シード（次回再取得される）だけを残す
          node scripts/validate-data.mjs || git checkout -- data/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/artworks.json data/fetch-report.json pipeline/seeds
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "data: nightly update ($(date -u +%Y-%m-%d))"
            git push origin HEAD:main
          fi
      - name: Record failure (Issue)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TEXT="$(node -e "try{const s=require('./nightly-summary.json');console.log(s.text)}catch{console.log('サマリーなし（途中で停止）')}")"
          gh issue create --title "夜間処理が失敗しました ($(date -u +%Y-%m-%d))" \
            --body "$(printf '%s\n\n実行ログ: %s/%s/actions/runs/%s' "$TEXT" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")" || true

  deploy:
    needs: nightly
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
